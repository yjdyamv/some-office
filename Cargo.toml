[workspace]
resolver = "2"
members = [
    "crates/office-cfb",
    "crates/office-blip",
    "crates/office-enc",
    "crates/office-crypto",
    "crates/office-doc",
    "crates/office-xls",
    "crates/office-ppt",
    "crates/officedump",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yjdyamv/some-office"
homepage = "https://github.com/yjdyamv/some-office"
rust-version = "1.73"
keywords = ["office", "doc", "xls", "ppt", "reverse-engineering"]
categories = ["parser-implementations", "encoding", "filesystem"]

[profile.release]
opt-level = 2
